services:
  - type: web
    name: ooca-letters-api
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci --include=dev && npm run build:api && npm prune --omit=dev
    startCommand: npm run start:api
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MYSQL_HOST
        sync: false
      - key: MYSQL_PORT
        sync: false
      - key: MYSQL_USER
        sync: false
      - key: MYSQL_PASSWORD
        sync: false
      - key: MYSQL_DATABASE
        sync: false
      - key: MYSQL_SSL
        value: "true"
      - key: ADMIN_PASSWORD
        sync: false
      - key: CORS_ORIGIN
        value: https://ooca-letters-web.onrender.com
      - key: COOKIE_SAME_SITE
        value: lax
      - key: COOKIE_SECURE
        value: "true"
  - type: web
    name: ooca-letters-web
    runtime: static
    buildCommand: npm ci --include=dev && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://ooca-letters-api.onrender.com